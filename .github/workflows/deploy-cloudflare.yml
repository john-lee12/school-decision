name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudflare-pages
  cancel-in-progress: true

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    name: Publish docs/ to Cloudflare Pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check credentials
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=0
          if [ -z "$TOKEN" ]; then
            echo "::error::缺少 secret CLOUDFLARE_API_TOKEN。到 https://dash.cloudflare.com/profile/api-tokens 建立 (權限: Account -> Cloudflare Pages -> Edit)，再執行 gh secret set CLOUDFLARE_API_TOKEN --repo ${{ github.repository }}"
            missing=1
          fi
          if [ -z "$ACCOUNT" ]; then
            echo "::error::缺少 secret CLOUDFLARE_ACCOUNT_ID。執行 npx wrangler whoami 取得後設定。"
            missing=1
          fi
          [ "$missing" = "1" ] && exit 1
          echo "憑證齊全，開始部署。"

      - name: Publish
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy docs --project-name=school-decision --branch=main --commit-dirty=true
