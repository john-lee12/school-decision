<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>國中升學決策表</title>
<meta name="description" content="公立、私中、國際學校、實驗教育、自學——一張給父母一起勾選的工作表：拆解「私中比較好」、比較五條路徑的退出成本，並排出行動時程。">
<meta name="color-scheme" content="light dark">
<meta property="og:type" content="website">
<meta property="og:title" content="國中升學決策表">
<meta property="og:description" content="把「聽說比較好」拆成可以查證的成分，把不可逆的決定盡量往後推。">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&display=swap">
<style>
:root{
  --paper:#F1F2F6; --surface:#FFFFFF; --surface-2:#E9EBF1;
  --ink:#191C28; --ink-2:#454B60; --muted:#6E7489;
  --rule:#D3D7E2; --rule-soft:#E4E6EE;
  --accent:#2F4A96; --accent-soft:#E4E9F6;
  --warn:#A4402B; --warn-soft:#F7E7E2;
  --ok:#356149; --ok-soft:#E1EDE6;
  --shadow:0 1px 2px rgba(25,28,40,.05), 0 10px 26px -20px rgba(25,28,40,.45);
  --seg-empty:#DDE0E9;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#12141C; --surface:#1A1D27; --surface-2:#232735;
    --ink:#E7E9F1; --ink-2:#B6BBCC; --muted:#8A90A5;
    --rule:#333849; --rule-soft:#272B3A;
    --accent:#93A9EC; --accent-soft:#232B44;
    --warn:#E29078; --warn-soft:#3A2620;
    --ok:#7FBB99; --ok-soft:#1F3229;
    --shadow:0 1px 2px rgba(0,0,0,.5), 0 10px 26px -20px rgba(0,0,0,.9);
    --seg-empty:#2C3142;
  }
}
:root[data-theme="dark"]{
  --paper:#12141C; --surface:#1A1D27; --surface-2:#232735;
  --ink:#E7E9F1; --ink-2:#B6BBCC; --muted:#8A90A5;
  --rule:#333849; --rule-soft:#272B3A;
  --accent:#93A9EC; --accent-soft:#232B44;
  --warn:#E29078; --warn-soft:#3A2620;
  --ok:#7FBB99; --ok-soft:#1F3229;
  --shadow:0 1px 2px rgba(0,0,0,.5), 0 10px 26px -20px rgba(0,0,0,.9);
  --seg-empty:#2C3142;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  font-size:15.5px; line-height:1.75;
  font-feature-settings:"palt" 1;
}
img{max-width:100%}
[hidden]{display:none!important}
.wrap{max-width:900px; margin:0 auto; padding:0 24px 96px}

/* ---------- masthead ---------- */
.masthead{padding:56px 0 28px; border-bottom:2px solid var(--ink)}
.kicker{
  font-family:"IBM Plex Mono",ui-monospace,monospace; font-size:11.5px;
  letter-spacing:.16em; color:var(--accent); margin:0 0 14px;
}
h1{
  font-family:"Noto Serif TC",Georgia,serif; font-weight:700;
  font-size:clamp(32px,5.4vw,46px); line-height:1.24; letter-spacing:.01em;
  margin:0 0 16px; text-wrap:balance;
}
.standfirst{max-width:62ch; color:var(--ink-2); font-size:16.5px; margin:0}
.standfirst b{color:var(--ink); font-weight:500}

/* ---------- status strip ---------- */
.strip{
  display:flex; flex-wrap:wrap; align-items:center; gap:8px 22px;
  padding:14px 0; border-bottom:1px solid var(--rule);
  font-family:"IBM Plex Mono",ui-monospace,monospace; font-size:12px;
  color:var(--muted); font-variant-numeric:tabular-nums;
}
.strip b{color:var(--ink); font-weight:500}
.strip .spacer{flex:1 1 auto}
.tool{
  font:inherit; font-size:11px; cursor:pointer; padding:3px 10px;
  border:1px solid var(--rule); border-radius:999px;
  background:var(--surface); color:var(--muted);
  transition:color .13s,border-color .13s;
}
.tool:hover{color:var(--accent); border-color:var(--accent)}
.chip{
  display:inline-flex; align-items:center; gap:6px;
  padding:2px 9px; border:1px solid var(--rule); border-radius:999px;
  font-size:11px; color:var(--muted); background:var(--surface);
}
.chip .dot{width:6px;height:6px;border-radius:50%;background:var(--muted)}
.chip.live{color:var(--ok); border-color:color-mix(in srgb,var(--ok) 40%,transparent)}
.chip.live .dot{background:var(--ok)}
.chip.ro{color:var(--warn); border-color:color-mix(in srgb,var(--warn) 40%,transparent)}
.chip.ro .dot{background:var(--warn)}

/* ---------- sections ---------- */
section{
  display:grid; grid-template-columns:64px minmax(0,1fr);
  padding-top:52px; margin-top:44px; border-top:1px solid var(--rule-soft);
}
section:first-of-type{border-top:0}
.snum{
  font-family:"IBM Plex Mono",ui-monospace,monospace; font-size:12px;
  color:var(--accent); padding-top:9px; letter-spacing:.06em;
}
.sbody{min-width:0}
h2{
  font-family:"Noto Serif TC",Georgia,serif; font-weight:700;
  font-size:25px; line-height:1.4; margin:0 0 10px; text-wrap:balance;
}
.lede{color:var(--ink-2); max-width:62ch; margin:0 0 26px}
h3{font-size:16px; font-weight:700; margin:34px 0 12px; line-height:1.5}
p{margin:0 0 14px}

/* ---------- verdict list ---------- */
.verdicts{display:flex; flex-direction:column; gap:0; margin:0; padding:0; list-style:none}
.verdicts li{
  display:grid; grid-template-columns:minmax(0,1fr) auto; gap:6px 18px;
  align-items:start; padding:15px 0; border-bottom:1px solid var(--rule-soft);
}
.verdicts li:first-child{border-top:1px solid var(--rule-soft)}
.v-name{font-weight:700}
.v-desc{grid-column:1; color:var(--ink-2); font-size:14.5px; margin:0}
.v-tag{
  grid-row:1/3; align-self:center;
  font-family:"IBM Plex Mono",ui-monospace,monospace; font-size:11px;
  padding:3px 9px; border-radius:3px; white-space:nowrap;
  background:var(--surface-2); color:var(--muted);
}
.v-tag.no{background:var(--warn-soft); color:var(--warn)}
.v-tag.yes{background:var(--ok-soft); color:var(--ok)}

.pullquote{
  margin:30px 0 0; padding:18px 22px; background:var(--accent-soft);
  border-left:3px solid var(--accent); border-radius:0 4px 4px 0;
  font-size:15.5px; color:var(--ink);
}
.pullquote p:last-child{margin-bottom:0}

/* ---------- observation ---------- */
.obs{display:flex; flex-direction:column; gap:14px}
.ob{
  background:var(--surface); border:1px solid var(--rule-soft); border-radius:4px;
  padding:18px 20px 16px;
}
.ob-q{display:flex; align-items:baseline; gap:10px; margin-bottom:14px}
.ob-id{
  font-family:"IBM Plex Mono",ui-monospace,monospace; font-size:11px;
  color:var(--muted); flex:none;
}
.ob-title{font-weight:700; font-size:16px}
.ob-pair{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.ob-opt{
  text-align:left; font:inherit; cursor:pointer;
  background:var(--paper); color:var(--ink-2);
  border:1px solid var(--rule); border-radius:4px;
  padding:11px 13px; line-height:1.5; transition:background .13s, border-color .13s, color .13s;
}
.ob-opt:hover{border-color:var(--accent)}
.ob-opt strong{display:block; font-size:14.5px; font-weight:700; color:var(--ink); margin-bottom:2px}
.ob-opt span{font-size:13px; display:block}
.ob-opt[aria-pressed="true"]{
  background:var(--accent-soft); border-color:var(--accent); color:var(--ink-2);
  box-shadow:inset 0 0 0 1px var(--accent);
}
.ob-read{
  margin-top:13px; padding-top:12px; border-top:1px dashed var(--rule);
  font-size:13.5px; color:var(--muted);
}
.ob-read b{color:var(--ink-2); font-weight:500}

/* ---------- path cards ---------- */
.paths{display:flex; flex-direction:column; gap:20px}
.path{
  background:var(--surface); border:1px solid var(--rule-soft);
  border-left:4px solid var(--stripe); border-radius:0 4px 4px 0;
  box-shadow:var(--shadow); overflow:hidden;
}
.path.is-out{opacity:.5}
.path-head{
  display:flex; flex-wrap:wrap; align-items:baseline; gap:6px 12px;
  padding:18px 22px 14px;
}
.path-name{font-family:"Noto Serif TC",Georgia,serif; font-size:21px; font-weight:700; line-height:1.3}
.path-tag{
  font-family:"IBM Plex Mono",ui-monospace,monospace; font-size:11px;
  color:var(--muted); padding:2px 8px; background:var(--surface-2); border-radius:3px;
}
.path-fields{
  display:grid; grid-template-columns:5.5rem minmax(0,1fr);
  gap:1px 16px; padding:0 22px 4px; align-items:start;
}
.f-label{
  font-family:"IBM Plex Mono",ui-monospace,monospace; font-size:11px;
  color:var(--muted); letter-spacing:.05em; padding-top:5px;
}
.f-val{padding:3px 0 9px; font-size:14.5px; color:var(--ink-2); min-width:0}
.f-val ul{margin:0; padding-left:1.15em}
.f-val li{margin-bottom:3px}
.f-val li::marker{color:var(--muted)}
.f-val.warn{color:var(--warn); font-weight:500}
.meter{display:inline-flex; gap:3px; vertical-align:-2px; margin-right:9px}
.meter i{width:15px; height:8px; border-radius:1px; background:var(--seg-empty); display:block}
.meter i.on{background:var(--lvlcolor)}
.f-val .exitnote{display:block; font-size:13.5px; color:var(--ink-2); font-weight:400; margin-top:4px}

.path-foot{
  display:flex; flex-wrap:wrap; align-items:center; gap:10px;
  padding:14px 22px 16px; margin-top:8px;
  border-top:1px solid var(--rule-soft); background:var(--paper);
}
.seg{display:inline-flex; border:1px solid var(--rule); border-radius:4px; overflow:hidden; flex:none}
.seg button{
  font:inherit; font-size:13px; cursor:pointer; padding:6px 15px;
  background:var(--surface); color:var(--ink-2); border:0; border-right:1px solid var(--rule);
  transition:background .13s,color .13s;
}
.seg button:last-child{border-right:0}
.seg button:hover{background:var(--surface-2)}
.seg button[aria-pressed="true"][data-v="in"]{background:var(--ok); color:#fff}
.seg button[aria-pressed="true"][data-v="out"]{background:var(--warn); color:#fff}
.note{
  flex:1 1 220px; min-width:0; font:inherit; font-size:13.5px;
  background:var(--surface); color:var(--ink);
  border:1px solid var(--rule); border-radius:4px; padding:6px 11px;
}
.note::placeholder{color:var(--muted)}

/* ---------- ladder ---------- */
.ladder{border-top:1px solid var(--rule); margin-top:4px}
.rung{
  display:grid; grid-template-columns:9.5rem 90px minmax(0,1fr);
  gap:4px 16px; align-items:center; padding:13px 0;
  border-bottom:1px solid var(--rule-soft);
}
.rung-name{font-weight:700; font-size:14.5px}
.rung-say{color:var(--ink-2); font-size:14px; min-width:0}

/* ---------- other routes ---------- */
.routes{display:grid; grid-template-columns:repeat(auto-fit,minmax(250px,1fr)); gap:1px; background:var(--rule-soft); border:1px solid var(--rule-soft)}
.route{background:var(--surface); padding:16px 18px}
.route h4{margin:0 0 5px; font-size:15px; font-weight:700}
.route .when{
  font-family:"IBM Plex Mono",ui-monospace,monospace; font-size:11px;
  color:var(--accent); display:block; margin-bottom:7px;
}
.route p{margin:0; font-size:13.5px; color:var(--ink-2); line-height:1.65}

/* ---------- alignment ---------- */
.fieldset{display:grid; grid-template-columns:1fr 1fr; gap:16px}
.field label{
  display:block; font-family:"IBM Plex Mono",ui-monospace,monospace;
  font-size:11px; letter-spacing:.06em; color:var(--muted); margin-bottom:6px;
}
.field textarea{
  width:100%; font:inherit; font-size:14.5px; line-height:1.7;
  background:var(--surface); color:var(--ink);
  border:1px solid var(--rule); border-radius:4px; padding:11px 13px;
  resize:vertical; min-height:110px;
}
.field textarea::placeholder{color:var(--muted)}
.keyfield{margin-top:22px; padding:20px 22px; background:var(--warn-soft); border-radius:4px}
.keyfield .field label{color:var(--warn)}
.keyfield h3{margin:0 0 4px}
.keyfield .why{margin:0 0 14px; font-size:14px; color:var(--ink-2)}
.keyfield textarea{min-height:84px; border-color:color-mix(in srgb,var(--warn) 35%,transparent)}

/* ---------- timeline ---------- */
.tl{border-top:1px solid var(--rule)}
.tl-phase{
  display:grid; grid-template-columns:8.5rem minmax(0,1fr); gap:6px 18px;
  padding:20px 0; border-bottom:1px solid var(--rule-soft);
}
.tl-when{
  font-family:"IBM Plex Mono",ui-monospace,monospace; font-size:12px;
  color:var(--accent); font-variant-numeric:tabular-nums; padding-top:2px;
}
.tl-when span{display:block; color:var(--muted); font-size:11px; margin-top:2px}
.tl-items{display:flex; flex-direction:column; gap:9px; min-width:0}
.task{display:flex; gap:11px; align-items:flex-start; cursor:pointer}
.task .box{
  flex:none; width:17px; height:17px; margin-top:4px; border-radius:3px;
  border:1.5px solid var(--rule); background:var(--surface);
  display:grid; place-items:center; transition:background .13s,border-color .13s;
}
.task .box svg{width:11px; height:11px; opacity:0; transition:opacity .13s}
.task[aria-pressed="true"] .box{background:var(--accent); border-color:var(--accent)}
.task[aria-pressed="true"] .box svg{opacity:1}
.task[aria-pressed="true"] .txt{color:var(--muted); text-decoration:line-through; text-decoration-color:var(--rule)}
.task .txt{font-size:14.5px; line-height:1.6; color:var(--ink-2)}
.task .txt b{color:var(--ink); font-weight:500}
.task:hover .box{border-color:var(--accent)}

/* ---------- closing ---------- */
.closing{
  margin-top:52px; padding:28px 30px; border:2px solid var(--ink); border-radius:4px;
}
.closing h2{font-size:21px; margin-bottom:12px}
.closing p:last-child{margin-bottom:0}
.closing .default{
  font-family:"Noto Serif TC",Georgia,serif; font-size:17.5px; line-height:1.7;
  color:var(--ink); margin-bottom:14px;
}
.foot{margin-top:34px; font-size:12.5px; color:var(--muted); line-height:1.7}
.foot a{color:var(--muted)}

/* ---------- toast ---------- */
.toast{
  position:fixed; left:50%; bottom:26px; transform:translateX(-50%);
  background:var(--ink); color:var(--paper); font-size:13px;
  padding:9px 18px; border-radius:999px; box-shadow:var(--shadow); z-index:20;
}

button:focus-visible,textarea:focus-visible,input:focus-visible,.task:focus-visible{
  outline:2px solid var(--accent); outline-offset:2px; border-radius:3px;
}
textarea:focus,.note:focus{border-color:var(--accent)}

@media (max-width:720px){
  .wrap{padding:0 18px 72px}
  section{grid-template-columns:1fr; padding-top:38px; margin-top:32px}
  .snum{padding-top:0; margin-bottom:8px}
  .ob-pair{grid-template-columns:1fr}
  .path-fields{grid-template-columns:1fr; gap:0}
  .f-label{padding-top:10px}
  .f-val{padding-bottom:6px}
  .rung{grid-template-columns:1fr; gap:6px}
  .fieldset{grid-template-columns:1fr}
  .tl-phase{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important; animation:none!important}}
@media print{
  body{background:#fff; font-size:11pt}
  .strip .tool,.toast{display:none}
  .path,.ob,.tl-phase{break-inside:avoid}
  .closing{border-color:#000}
}
</style>
</head>
<body>
<div id="root"></div>
<script>
(function(){
"use strict";

var STORE_KEY = "jhs-decision-v1";

/* ============ state ============ */
var state = {observations:{}, paths:{}, vision:{a:"",b:""}, exitRule:"", tasks:{}, updatedAt:null};
var loadedFrom = "new";

function normalize(s){
  s = s && typeof s === "object" ? s : {};
  return {
    observations: s.observations && typeof s.observations === "object" ? s.observations : {},
    paths:        s.paths && typeof s.paths === "object" ? s.paths : {},
    vision:       {a: (s.vision && s.vision.a) || "", b: (s.vision && s.vision.b) || ""},
    exitRule:     s.exitRule || "",
    tasks:        s.tasks && typeof s.tasks === "object" ? s.tasks : {},
    updatedAt:    s.updatedAt || null
  };
}

/* base64url <-> UTF-8, for sharing state in the URL */
function b64enc(str){
  var bytes = new TextEncoder().encode(str), bin = "";
  for(var i=0;i<bytes.length;i++) bin += String.fromCharCode(bytes[i]);
  return btoa(bin).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
}
function b64dec(s){
  s = s.replace(/-/g,"+").replace(/_/g,"/");
  while(s.length % 4) s += "=";
  var bin = atob(s), bytes = new Uint8Array(bin.length);
  for(var i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}

function loadState(){
  var m = /[#&]s=([A-Za-z0-9_-]+)/.exec(location.hash);
  if(m){
    try{
      state = normalize(JSON.parse(b64dec(m[1])));
      loadedFrom = "link";
      try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }catch(e){}
      history.replaceState(null, "", location.pathname + location.search);
      return;
    }catch(e){ /* 連結壞了就當作沒有，往下讀本機紀錄 */ }
  }
  try{
    var raw = localStorage.getItem(STORE_KEY);
    if(raw){ state = normalize(JSON.parse(raw)); loadedFrom = "local"; }
  }catch(e){ loadedFrom = "nostore"; }
}

var saveTimer = null;
function save(){
  state.updatedAt = new Date().toISOString();
  updateStrip();
  clearTimeout(saveTimer);
  saveTimer = setTimeout(function(){
    try{
      localStorage.setItem(STORE_KEY, JSON.stringify(state));
      chip("live", "已存到這台裝置");
    }catch(e){
      chip("ro", "此瀏覽器無法儲存");
    }
  }, 400);
}

/* ============ content ============ */
var VERDICTS = [
  {name:"篩選效應", tag:"不是教學", cls:"no",
   desc:"入學先篩過一輪，同儕的學習動機與家庭資源同質性高。這是「同學好」，不是「老師教得好」。"},
  {name:"時間堆疊", tag:"真實，但有代價", cls:"",
   desc:"早自習、第八節、晚自習、週六輔導，每天多 2–3 小時。成效是真的，代價是睡眠、運動與自主時間。"},
  {name:"進度與考試密度", tag:"雙面刃", cls:"",
   desc:"國中教高中內容、月考加小考。對吸收快的孩子是加速器，對需要慢火的孩子是夾生飯。"},
  {name:"行政與師資一致性", tag:"真實優勢", cls:"yes",
   desc:"公立國中依法必須常態編班、教師屬公務體系不易汰換；私中對教師與班級經營的掌控度高。這是私中唯一真正屬於「教學品質」的優勢。"}
];

var DIMS = [
  {id:"d1", t:"自律引擎在內還是在外",
   a:{h:"外部驅動", s:"要人盯、有結構才動得起來"},
   b:{h:"內部驅動", s:"自己會讀，有自己的步調"},
   read:"外部驅動 → 私中或嚴管型環境的結構真的有用。內部驅動 → 高密度課表反而會壓抑他，把他本來就有的引擎關掉。"},
  {id:"d2", t:"排名壓力下，他會被激發還是熄火",
   a:{h:"被激發", s:"輸了會想扳回來"},
   b:{h:"會熄火", s:"落後久了就放棄，或開始逃避"},
   read:"小學前三名進私中可能變中後段。這個衝擊對自我概念的影響，比多學兩章數學重要得多。會熄火的孩子需要一個他能站在前段的環境。"},
  {id:"d3", t:"學習吸收的型態",
   a:{h:"快而廣", s:"喜歡難題，講一次就懂"},
   b:{h:"慢而深", s:"靠理解不靠反覆，需要時間消化"},
   read:"慢而深的孩子遇到超前進度會全面崩塌 —— 不是不夠聰明，是沒有時間把地基蓋起來。這類孩子在公立的正常進度下反而能走得更遠。"},
  {id:"d4", t:"社交彈性",

/* ============ helpers ============ */
function esc(s){
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;")
    .replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
function lvlColor(n){ return n<=2 ? "var(--ok)" : (n===3 ? "var(--accent)" : "var(--warn)"); }
function meter(n){
  var s = '<span class="meter" style="--lvlcolor:'+lvlColor(n)+'" role="img" aria-label="退出成本 '+n+' / 5">';
  for(var i=1;i<=5;i++) s += '<i class="'+(i<=n?"on":"")+'"></i>';
  return s + "</span>";
}
function listOf(arr){
  return "<ul>" + arr.map(function(x){ return "<li>"+x+"</li>"; }).join("") + "</ul>";
}

  h.push('<section><div class="snum">04</div><div class="sbody">');
  h.push('<h2>退出成本階梯</h2>');
  h.push('<p class="lede">「退出成本」指的是：讀了一兩年之後想換回體制內普通國中，有多難。這是最被低估的判準 —— 因為 12 歲的孩子和 15 歲的孩子，是兩個人。</p>');
  h.push('<div class="ladder">');
  LADDER.forEach(function(r){
    h.push('<div class="rung"><span class="rung-name">'+r.n+'</span>',
           '<span>'+meter(r.lvl)+'</span>',
           '<span class="rung-say">'+r.say+'</span></div>');
  });
  h.push('</div>');
  h.push('<div class="pullquote"><p><b>建議原則：小五做不可逆的決定太早。</b>在 12 到 15 歲這段，孩子的興趣、自律、體能與社交型態都會劇烈變化。',
         '合理的策略是先選可逆性高的路徑，把不可逆的決定延後到高中階段再做 —— 那時孩子能真正參與決策，資訊也更完整。</p>',
         '<p>唯一的例外是國際路線：如果已經確定孩子出國且財力能撐十年，越早進入英語授課環境語言優勢越大。但它也是最不可逆的，所以必須是「確定」，不能是「試試看」。</p></div>');
  h.push('</div></section>');

  /* 05 */
  h.push('<section><div class="snum">05</div><div class="sbody">');
  h.push('<h2>常被忽略的其他管道</h2>');
  h.push('<p class="lede">這些管道大多不需要換學校就能走，卻很少出現在家長之間的對話裡。其中好幾條能在公立體系內取得接近私中的密度與同儕。</p>');
  h.push('<div class="routes">');
  ROUTES.forEach(function(r){
    h.push('<div class="route"><h4>'+r.h+'</h4><span class="when">'+r.w+'</span><p>'+r.p+'</p></div>');
  });
  h.push('</div></div></section>');

  /* 06 */
  h.push('<section><div class="snum">06</div><div class="sbody">');
  h.push('<h2>父母之間先對齊</h2>');
  h.push('<p class="lede">多數選校的爭執，表面上是在吵學校，實際上是兩個人對「什麼叫好結果」的定義不同。先各自寫，寫完再一起看 —— 不要一邊討論一邊寫。</p>');
  h.push('<div class="fieldset">',
    '<div class="field"><label>家長 A ── 我希望他 25 歲時是什麼樣子</label>',
      '<textarea data-vision="a" placeholder="具體一點。不是「快樂就好」，而是：他在做什麼、跟誰在一起、怎麼面對挫折、經濟上是什麼狀態。">'+esc(state.vision.a)+'</textarea></div>',
    '<div class="field"><label>家長 B ── 我希望他 25 歲時是什麼樣子</label>',
      '<textarea data-vision="b" placeholder="先不要看對方寫什麼。寫完再交換。">'+esc(state.vision.b)+'</textarea></div>',
  '</div>');
  h.push('<div class="keyfield">',
    '<h3>退場條件 ── 在放榜之前就寫下來</h3>',
    '<p class="why">很多家庭考上私中後被沉沒成本綁架：「都考上了不去很可惜。」破解方法只有一個 —— 在還沒有錄取通知、還沒有情緒的時候，先講好什麼條件下我們會選公立。這一欄是整張表最有價值的地方。</p>',
    '<div class="field"><label>在什麼條件下，我們會選公立國中？</label>',
    '<textarea data-exitrule="1" placeholder="例：如果通勤超過 40 分鐘／如果他自己明確說不想去／如果晚自習到九點以後／如果學費會讓我們動用到高中的預算／如果他在第 2 節的五題裡有三題落在需要慢火那一側。">'+esc(state.exitRule)+'</textarea></div>',
  '</div>');
  h.push('</div></section>');

  /* 07 */
  h.push('<section><div class="snum">07</div><div class="sbody">');
  h.push('<h2>時程與行動</h2>');
  h.push('<p class="lede">以「入學前兩年」為起點往回推。行政時程各縣市與各校不同，實際請以當年度簡章為準 —— 這裡標的是「該在什麼時候開始查」。</p>');
  h.push('<div class="tl">');
  PHASES.forEach(function(ph){
    h.push('<div class="tl-phase"><div class="tl-when">'+ph.when+(ph.sub?'<span>'+ph.sub+'</span>':'')+'</div><div class="tl-items">');
    ph.items.forEach(function(it){
      var on = !!state.tasks[it.id];
      h.push('<div class="task" role="button" tabindex="0" data-task="'+it.id+'" aria-pressed="'+on+'">',
        '<span class="box"><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2 6.2 4.7 9 10 3.3" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>',
        '<span class="txt">'+it.txt+'</span>',
      '</div>');
    });
    h.push('</div></div>');
  });
  h.push('</div></div></section>');

  h.push('<div class="closing">',
    '<h2>如果一定要給一個預設值</h2>',
    '<p class="default">公立學區國中　＋　主動補強（資優班鑑定，或選定 1–2 個領域深度發展）　＋　把私中的學費存下來，留給高中與大學階段。</p>',
    '<p>對多數家庭，這是風險最低、可逆性最高、結果分布最穩定的選擇。要偏離這個預設值，應該要有明確理由 —— 孩子特質確實需要、家庭已確定海外路線、或學區學校有你親自查證過的具體問題 —— 而不是因為「聽說比較好」。</p>',
    '<p>還有一件事比選學校更能決定結果：孩子的自律、閱讀習慣，以及他跟你們的關係。如果家裡每晚是戰場，換學校不會解決它。</p>',
  '</div>');

  h.push('<p class="foot">本表整理自公開的升學制度資訊，招生方式、費用與申請時程各縣市與各校差異大且逐年調整，決策前請以當年度官方簡章與學校說明為準。',
         '勾選內容只存在你自己的瀏覽器，不會上傳到任何伺服器。國中三年是孩子在過，不是你們在過 —— 最後階段請讓他真的有發言權。</p>');

  h.push('</div>');
  document.getElementById("root").innerHTML = h.join("");
  updateStrip();
}

/* ============ summary strip ============ */
function updateStrip(){
  var inC=0, outC=0;
  PATHS.forEach(function(p){
    var s = state.paths[p.key] && state.paths[p.key].status;
    if(s==="in") inC++; else if(s==="out") outC++;
  });
  var obsC = DIMS.filter(function(d){ return state.observations[d.id]; }).length;
  var total=0, done=0;
  PHASES.forEach(function(ph){ ph.items.forEach(function(it){ total++; if(state.tasks[it.id]) done++; }); });

  set("s-paths", inC+" 考慮 · "+outC+" 排除 · "+(PATHS.length-inC-outC)+" 未定");
  set("s-obs", obsC+" / "+DIMS.length);
  set("s-tasks", done+" / "+total);
  var el = document.getElementById("s-updated");
  if(el) el.textContent = state.updatedAt ? ("最後更新 "+fmt(state.updatedAt)) : "";
}
function set(id,txt){ var el=document.getElementById(id); if(el) el.textContent=txt; }
function fmt(iso){
  try{
    var d = new Date(iso);
    return d.getFullYear()+"/"+(d.getMonth()+1)+"/"+d.getDate()+" "+
      String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");
  }catch(e){ return ""; }
}
function chip(cls,txt){
  var c=document.getElementById("s-chip"), t=document.getElementById("s-chiptxt");
  if(!c||!t) return;
  c.className = "chip"+(cls?" "+cls:"");
  t.textContent = txt;
}
var toastTimer=null;
function toast(msg){
  var el = document.getElementById("toast");
  if(!el){ el=document.createElement("div"); el.id="toast"; el.className="toast"; document.body.appendChild(el); }
  el.textContent = msg; el.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ el.hidden = true; }, 2600);
}

/* ============ interaction ============ */
function toggleTask(el){
  var id = el.getAttribute("data-task");
  var on = el.getAttribute("aria-pressed") === "true";
  el.setAttribute("aria-pressed", String(!on));
  if(on) delete state.tasks[id]; else state.tasks[id] = true;
  save();
}

document.addEventListener("click", function(e){
  var t;

  if((t = e.target.closest("#btn-share"))){
    var url = location.origin + location.pathname + "#s=" + b64enc(JSON.stringify(state));
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(url).then(
        function(){ toast("連結已複製 —— 傳給另一半，打開就會看到你的進度"); },
        function(){ window.prompt("複製這個連結：", url); }
      );
    } else { window.prompt("複製這個連結：", url); }
    return;
  }

  if((t = e.target.closest("#btn-theme"))){
    var root = document.documentElement;
    var cur = root.getAttribute("data-theme");
    var sysDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
    var next = cur ? (cur === "dark" ? "light" : "dark") : (sysDark ? "light" : "dark");
    root.setAttribute("data-theme", next);
    try{ localStorage.setItem(STORE_KEY+":theme", next); }catch(err){}
    return;
  }

  if((t = e.target.closest("#btn-reset"))){
    if(window.confirm("清除這台裝置上的所有勾選與筆記？這個動作無法復原。")){
      state = normalize({});
      try{ localStorage.removeItem(STORE_KEY); }catch(err){}
      render(); chip("", "已清除"); toast("已清除");
    }
    return;
  }

  if((t = e.target.closest("[data-obs]"))){
    var d = t.getAttribute("data-obs"), v = t.getAttribute("data-v");
    state.observations[d] = (state.observations[d] === v) ? null : v;
    if(!state.observations[d]) delete state.observations[d];
    document.querySelectorAll('[data-obs="'+d+'"]').forEach(function(b){
      b.setAttribute("aria-pressed", String(state.observations[d] === b.getAttribute("data-v")));
    });
    save();
    return;
  }

  if((t = e.target.closest("[data-path]"))){
    var k = t.getAttribute("data-path"), pv = t.getAttribute("data-v");
    var rec = state.paths[k] || (state.paths[k] = {status:null, note:""});
    rec.status = (rec.status === pv) ? null : pv;
    document.querySelectorAll('[data-path="'+k+'"]').forEach(function(b){
      b.setAttribute("aria-pressed", String(rec.status === b.getAttribute("data-v")));
    });
    var card = document.getElementById("path-"+k);
    if(card) card.classList.toggle("is-out", rec.status === "out");
    save();
    return;
  }

  if((t = e.target.closest(".task"))) toggleTask(t);
}, false);

document.addEventListener("keydown", function(e){
  if(e.key !== "Enter" && e.key !== " ") return;
  var t = e.target.closest && e.target.closest(".task");
  if(t){ e.preventDefault(); toggleTask(t); }
}, false);

document.addEventListener("input", function(e){
  var el = e.target;
  if(el.matches && el.matches("[data-note]")){
    var k = el.getAttribute("data-note");
    var rec = state.paths[k] || (state.paths[k] = {status:null, note:""});
    rec.note = el.value; save();
  } else if(el.matches && el.matches("[data-vision]")){
    state.vision[el.getAttribute("data-vision")] = el.value; save();
  } else if(el.matches && el.matches("[data-exitrule]")){
    state.exitRule = el.value; save();
  }
}, false);

/* ============ boot ============ */
try{
  var savedTheme = localStorage.getItem(STORE_KEY+":theme");
  if(savedTheme === "dark" || savedTheme === "light") document.documentElement.setAttribute("data-theme", savedTheme);
}catch(e){}

loadState();
render();

if(loadedFrom === "link")      { chip("live", "已從分享連結載入"); toast("已載入分享連結裡的進度"); }
else if(loadedFrom === "local"){ chip("live", "已存到這台裝置"); }
else if(loadedFrom === "nostore"){ chip("ro", "此瀏覽器無法儲存"); }
else                           { chip("", "勾選會自動儲存"); }
})();
</script>
</body>
</html>
